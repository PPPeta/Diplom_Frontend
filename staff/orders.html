<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Реестр заказов</title>
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-zone="staff" data-page="orders" data-root="../">
<main id="view">
  <div class="page-head"><div><h1 class="page-title">Реестр заказов</h1><p class="page-sub">Все заказы организации.</p></div></div>
  <div class="filters">
    <div class="search"><input id="q" class="input" placeholder="Поиск по № или клиенту…"></div>
    <select id="status-filter" class="input">
      <option value="">Все статусы</option>
      <option value="new">Новый</option>
      <option value="confirmed">Подтверждён</option>
      <option value="in_progress">В работе</option>
      <option value="done">Выполнен</option>
      <option value="closed">Закрыт</option>
      <option value="cancelled">Отменён</option>
    </select>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>№</th><th>Клиент / партнёр</th><th>Дата</th><th>Сумма</th><th>Статус</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="t-muted">Загрузка…</td></tr></tbody>
    </table>
  </div>
</main>
<script src="../assets/js/api.js"></script>
<script>
(function(){
  var OS = { new:{l:'Новый'}, confirmed:{l:'Подтверждён'}, in_progress:{l:'В работе'}, done:{l:'Выполнен'}, closed:{l:'Закрыт'}, cancelled:{l:'Отменён'} };
  var rows = document.getElementById('rows');
  var q = document.getElementById('q');
  var sf = document.getElementById('status-filter');
  var all = [];
  function fmtDate(iso){ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d)) return iso; return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2); }
  function clientLabel(o){ return o.client_ref || (o.partner_id ? 'Партнёр #'+o.partner_id : '—'); }
  function statusSelect(o){
    return '<select class="input" data-order="'+o.id+'" data-prev="'+o.status+'" style="padding:4px 8px">' +
      Object.keys(OS).map(function(k){ return '<option value="'+k+'"'+(k===o.status?' selected':'')+'>'+OS[k].l+'</option>'; }).join('') + '</select>';
  }
  function render(){
    var term=(q.value||'').toLowerCase(); var st=sf.value;
    var list=all.filter(function(o){
      var okT=!term || (o.number||'').toLowerCase().indexOf(term)>=0 || clientLabel(o).toLowerCase().indexOf(term)>=0;
      var okS=!st || o.status===st; return okT&&okS;
    });
    if(!list.length){ rows.innerHTML='<tr><td colspan="5" class="t-muted">Заказов нет.</td></tr>'; return; }
    rows.innerHTML=list.map(function(o){
      return '<tr><td class="t-strong">'+o.number+'</td><td>'+clientLabel(o)+'</td><td>'+fmtDate(o.created_at)+'</td><td class="t-mono">'+window.API.fmtPrice(o.total_amount)+'</td><td>'+statusSelect(o)+'</td></tr>';
    }).join('');
  }
  rows.addEventListener('change', function(e){
    var sel=e.target.closest('select[data-order]'); if(!sel) return;
    var id=sel.getAttribute('data-order'), st=sel.value, prev=sel.getAttribute('data-prev');
    sel.disabled=true;
    window.API.orders.setStatus(id, st).then(function(){ window.toast('Статус заказа обновлён','success'); sel.setAttribute('data-prev',st); sel.disabled=false; })
    .catch(function(err){ window.toast(err.status===409?'Недопустимый переход статуса':('Ошибка: '+err.message),'error'); sel.value=prev; sel.disabled=false; });
  });
  q.addEventListener('input', render);
  sf.addEventListener('change', render);
  window.API.orders.list().then(function(list){ all=list||[]; render(); })
  .catch(function(err){ rows.innerHTML='<tr><td colspan="5" class="t-muted">'+(err.status===401?'Требуется вход менеджера.':'Не удалось загрузить заказы.')+'</td></tr>'; });
})();
</script>
<script src="../assets/js/app.js"></script>
</body>
</html>
