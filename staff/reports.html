<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отчёты — Панель сотрудника</title>
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-zone="staff" data-page="reports" data-root="../">
<main id="view">
  <div class="page-head"><div><h1 class="page-title">Отчёты</h1><p class="page-sub">Аналитика по заказам и выручке.</p></div></div>
  <div class="grid g-4">
    <div class="stat"><div class="lbl"><span class="ic">📑</span> Заказов</div><div class="num" id="r-orders">—</div></div>
    <div class="stat"><div class="lbl"><span class="ic">💰</span> Сумма заказов</div><div class="num" id="r-sum">—</div></div>
    <div class="stat"><div class="lbl"><span class="ic">✅</span> Завершено</div><div class="num" id="r-done">—</div></div>
    <div class="stat"><div class="lbl"><span class="ic">🏦</span> Получено оплат</div><div class="num" id="r-paid">—</div></div>
  </div>
  <div class="cols mt">
    <div class="card"><div class="card-h"><h3>Заказы по статусам</h3></div><div id="byStatus"><div class="list-row"><span class="t-muted">Загрузка…</span></div></div></div>
    <div class="card"><div class="card-h"><h3>Выручка по месяцам</h3></div><div id="byMonth"><div class="list-row"><span class="t-muted">Загрузка…</span></div></div></div>
  </div>
</main>
<script src="../assets/js/api.js"></script>
<script>
(function(){
  var esc=window.API.escapeHtml;
  var OS={ new:'Новый', confirmed:'Подтверждён', in_progress:'В работе', done:'Выполнен', closed:'Закрыт', cancelled:'Отменён' };
  var MN=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  function err(box,e){ box.innerHTML='<div class="list-row"><span class="t-muted">'+(e&&e.status===403?'Доступ только для персонала.':'Не удалось загрузить.')+'</span></div>'; }
  window.API.orders.list().then(function(list){
    list=list||[];
    var sum=0,done=0,byStatus={},byMonth={};
    list.forEach(function(o){ sum+=Number(o.total_amount)||0; if(o.status==='done'||o.status==='closed') done++; byStatus[o.status]=(byStatus[o.status]||0)+1;
      var d=new Date(o.created_at); if(!isNaN(d)){ var k=d.getFullYear()+'-'+('0'+d.getMonth()).slice(-2); byMonth[k]=(byMonth[k]||0)+(Number(o.total_amount)||0); } });
    document.getElementById('r-orders').textContent=list.length;
    document.getElementById('r-sum').textContent=window.API.fmtPrice(sum);
    document.getElementById('r-done').textContent=done;
    var bs=document.getElementById('byStatus');
    var keys=Object.keys(byStatus);
    bs.innerHTML = keys.length ? keys.map(function(k){ return '<div class="list-row"><span>'+esc(OS[k]||k)+'</span><b>'+byStatus[k]+'</b></div>'; }).join('') : '<div class="list-row"><span class="t-muted">Нет данных.</span></div>';
    var bm=document.getElementById('byMonth');
    var mkeys=Object.keys(byMonth).sort();
    bm.innerHTML = mkeys.length ? mkeys.map(function(k){ var p=k.split('-'); return '<div class="list-row"><span>'+MN[Number(p[1])]+' '+p[0]+'</span><b class="t-mono">'+window.API.fmtPrice(byMonth[k])+'</b></div>'; }).join('') : '<div class="list-row"><span class="t-muted">Нет данных.</span></div>';
  }).catch(function(e){ err(document.getElementById('byStatus'),e); err(document.getElementById('byMonth'),e); });
  window.API.payments.list().then(function(list){ list=list||[]; var paid=0; list.forEach(function(p){ if(p.status==='paid') paid+=Number(p.amount)||0; }); document.getElementById('r-paid').textContent=window.API.fmtPrice(paid); })
  .catch(function(){ document.getElementById('r-paid').textContent='—'; });
})();
</script>
<script src="../assets/js/app.js"></script>
</body>
</html>
