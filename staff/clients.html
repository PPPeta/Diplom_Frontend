<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Клиенты — Панель сотрудника</title>
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-zone="staff" data-page="clients" data-root="../">
<main id="view">
  <div class="page-head"><div><h1 class="page-title">Клиенты</h1><p class="page-sub">Организации-партнёры и контрагенты.</p></div></div>
  <div class="filters"><div class="search"><input id="q" class="input" placeholder="Поиск по названию или ИНН…"></div></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Организация</th><th>ИНН</th><th>Тип</th><th>Договор</th><th>Создан</th><th>Статус</th></tr></thead>
      <tbody id="rows"><tr><td colspan="6" class="t-muted">Загрузка…</td></tr></tbody>
    </table>
  </div>
</main>
<script src="../assets/js/api.js"></script>
<script>
(function(){
  var esc=window.API.escapeHtml;
  var TYPE={ insurance:'Страховая', corporate:'Корпоративный', allied:'Партнёр' };
  var ST={ active:['Активен','green'], blocked:['Заблокирован','gray'], inactive:['Неактивен','gray'] };
  var rows=document.getElementById('rows'); var q=document.getElementById('q'); var all=[];
  function fmtDate(iso){ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d)) return esc(iso); return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear(); }
  function sb(st){ var v=ST[st]||[st,'gray']; return '<span class="badge badge--'+v[1]+'">'+esc(v[0])+'</span>'; }
  function render(){
    var term=(q.value||'').toLowerCase();
    var list=all.filter(function(p){ return !term || (p.org_name||'').toLowerCase().indexOf(term)>=0 || (p.inn||'').toLowerCase().indexOf(term)>=0; });
    if(!list.length){ rows.innerHTML='<tr><td colspan="6" class="t-muted">Партнёров нет.</td></tr>'; return; }
    rows.innerHTML=list.map(function(p){ return '<tr><td class="t-strong">'+esc(p.org_name)+'</td><td class="t-mono">'+esc(p.inn||'—')+'</td><td>'+esc(TYPE[p.type]||p.type||'—')+'</td><td>'+esc(p.contract_no||'—')+'</td><td>'+fmtDate(p.created_at)+'</td><td>'+sb(p.status)+'</td></tr>'; }).join('');
  }
  q.addEventListener('input', render);
  window.API.request('/partners').then(function(list){ all=list||[]; render(); })
  .catch(function(err){ rows.innerHTML='<tr><td colspan="6" class="t-muted">'+(err.status===401?'Требуется вход.':(err.status===403?'Доступ только для персонала.':'Не удалось загрузить список.'))+'</td></tr>'; });
})();
</script>
<script src="../assets/js/app.js"></script>
</body>
</html>
