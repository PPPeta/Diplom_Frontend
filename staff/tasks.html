<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задачи — Панель сотрудника</title>
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-zone="staff" data-page="tasks" data-root="../">
<main id="view">
  <div class="page-head"><div><h1 class="page-title">Задачи</h1><p class="page-sub">Назначения исполнителям и контроль сроков.</p></div></div>
  <div class="filters"><div class="chips" id="chips"><span class="chip active" data-st="">Все</span><span class="chip" data-st="open">Новые</span><span class="chip" data-st="in_progress">В работе</span><span class="chip" data-st="done">Готово</span></div></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Задача</th><th>Заказ</th><th>Исполнитель</th><th>Срок</th><th>Статус</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="t-muted">Загрузка…</td></tr></tbody>
    </table>
  </div>
</main>
<script src="../assets/js/api.js"></script>
<script>
(function(){
  var esc = window.API.escapeHtml;
  var TS = { open:{l:'Новая'}, in_progress:{l:'В работе'}, done:{l:'Готово'} };
  var rows=document.getElementById('rows');
  var chips=document.getElementById('chips');
  var all=[];
  function fmtDate(iso){ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d)) return esc(iso); return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2); }
  function activeSt(){ var a=chips.querySelector('.chip.active'); return a?(a.getAttribute('data-st')||''):''; }
  function statusSelect(t){
    return '<select class="input" data-task="'+t.id+'" data-prev="'+esc(t.status)+'" style="padding:4px 8px">' +
      Object.keys(TS).map(function(k){ return '<option value="'+k+'"'+(k===t.status?' selected':'')+'>'+TS[k].l+'</option>'; }).join('') + '</select>';
  }
  function render(){
    var st=activeSt();
    var list=all.filter(function(t){ return !st || t.status===st; });
    if(!list.length){ rows.innerHTML='<tr><td colspan="5" class="t-muted">Задач нет.</td></tr>'; return; }
    rows.innerHTML=list.map(function(t){
      var exec = t.executor_id ? ('Исп. #'+t.executor_id) : '<span class="t-muted">не назначен</span>';
      return '<tr><td class="t-strong">'+esc(t.title)+'</td><td>#'+t.order_id+'</td><td>'+exec+'</td><td>'+fmtDate(t.due_date)+'</td><td>'+statusSelect(t)+'</td></tr>';
    }).join('');
  }
  chips.querySelectorAll('.chip').forEach(function(ch){ ch.addEventListener('click', function(){ chips.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active');}); ch.classList.add('active'); render(); }); });
  rows.addEventListener('change', function(e){
    var sel=e.target.closest('select[data-task]'); if(!sel) return;
    var id=sel.getAttribute('data-task'), st=sel.value, prev=sel.getAttribute('data-prev'); sel.disabled=true;
    window.API.request('/tasks/'+id, { method:'PATCH', json:{ status:st } }).then(function(){ window.toast('Статус задачи обновлён','success'); sel.setAttribute('data-prev',st); sel.disabled=false; var it=all.filter(function(x){return String(x.id)===String(id);})[0]; if(it) it.status=st; })
    .catch(function(err){ window.toast('Ошибка: '+err.message,'error'); sel.value=prev; sel.disabled=false; });
  });
  window.API.request('/tasks').then(function(list){ all=list||[]; render(); })
  .catch(function(err){ rows.innerHTML='<tr><td colspan="5" class="t-muted">'+(err.status===401?'Требуется вход.':'Не удалось загрузить задачи.')+'</td></tr>'; });
})();
</script>
<script src="../assets/js/app.js"></script>
</body>
</html>
