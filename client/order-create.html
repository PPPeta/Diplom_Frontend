<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оформить заказ — Кабинет клиента</title>
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-zone="client" data-page="order-create" data-root="../">
<main id="view">
  <div class="page-head"><div><h1 class="page-title">Оформить заказ</h1><p class="page-sub">Выберите услуги и количество — справа видно, что попало в заказ.</p></div></div>
  <div class="cols mt">
    <div class="card">
      <div class="card-h"><h3>Каталог услуг</h3></div>
      <div id="svcList"><div class="list-row"><span class="t-muted">Загрузка услуг…</span></div></div>
    </div>
    <aside class="card">
      <div class="card-h"><h3>🛒 Ваш заказ</h3></div>
      <div id="cart"><div class="list-row"><span class="t-muted">Корзина пуста — укажите количество услуг слева.</span></div></div>
      <hr class="divider">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="t-muted">Позиций</span><b id="cartCount">0</b></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:18px"><span>Итого</span><b id="total" class="t-mono">0 ₽</b></div>
      <div class="field" style="margin-top:14px"><label>Комментарий к заказу (необязательно)</label><textarea id="orderNote" class="input" rows="2" placeholder="Пожелания, адрес, детали…"></textarea></div>
      <button class="btn btn-primary" id="createBtn" style="width:100%;margin-top:12px" disabled>Создать заказ</button>
      <p class="t-muted" style="margin-top:10px;font-size:13px">💡 Сумма предварительная; менеджер подтвердит заказ.</p>
    </aside>
  </div>
</main>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
  var esc=window.API.escapeHtml;
  var listEl=document.getElementById('svcList');
  var cartEl=document.getElementById('cart');
  var totalEl=document.getElementById('total');
  var countEl=document.getElementById('cartCount');
  var btn=document.getElementById('createBtn');
  var noteEl=document.getElementById('orderNote');
  var SVC=[];
  function qval(id){ var el=document.getElementById('q-'+id); return el?Math.max(0,parseInt(el.value,10)||0):0; }
  function setQ(id,v){ var el=document.getElementById('q-'+id); if(el){ el.value=Math.max(0,v); recalc(); } }
  function recalc(){
    var t=0, items=[];
    SVC.forEach(function(s){ var q=qval(s.id); if(q>0){ var sum=q*Number(s.base_price); t+=sum; items.push({s:s,q:q,sum:sum}); } });
    totalEl.textContent=window.API.fmtPrice(t);
    countEl.textContent=items.length;
    btn.disabled=items.length===0;
    if(!items.length){ cartEl.innerHTML='<div class="list-row"><span class="t-muted">Корзина пуста — укажите количество услуг слева.</span></div>'; return; }
    cartEl.innerHTML=items.map(function(it){
      return '<div class="list-row" style="display:flex;justify-content:space-between;gap:10px"><span>'+esc(it.s.name)+' <span class="t-muted">×'+it.q+' × '+window.API.fmtPrice(it.s.base_price)+'</span></span><b class="t-mono">'+window.API.fmtPrice(it.sum)+'</b></div>';
    }).join('');
  }
  function render(list){
    SVC=list||[];
    if(!SVC.length){ listEl.innerHTML='<div class="list-row"><span class="t-muted">Каталог услуг пуст.</span></div>'; return; }
    listEl.innerHTML=SVC.map(function(s){
      return '<div class="list-row" style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><b>'+esc(s.name)+'</b><div class="t-muted t-mono">'+esc(s.code)+' · '+window.API.fmtPrice(s.base_price)+'</div></div>'+
        '<div style="display:flex;align-items:center;gap:6px"><button type="button" class="btn btn-sm" data-dec="'+esc(s.id)+'">−</button><input type="number" min="0" value="0" id="q-'+esc(s.id)+'" class="input" style="width:64px;text-align:center"><button type="button" class="btn btn-sm" data-inc="'+esc(s.id)+'">+</button></div></div>';
    }).join('');
    recalc();
  }
  listEl.addEventListener('input', function(e){ if(e.target.id&&e.target.id.indexOf('q-')===0) recalc(); });
  listEl.addEventListener('click', function(e){
    var inc=e.target.getAttribute&&e.target.getAttribute('data-inc');
    var dec=e.target.getAttribute&&e.target.getAttribute('data-dec');
    if(inc){ setQ(inc,qval(inc)+1); }
    else if(dec){ setQ(dec,qval(dec)-1); }
  });
  btn.addEventListener('click', function(){
    var items=[];
    SVC.forEach(function(s){ var q=qval(s.id); if(q>0) items.push({ service_id:s.id, qty:q }); });
    if(!items.length){ if(window.toast) toast('Выберите хотя бы одну услугу','error'); return; }
    btn.disabled=true;
    var payload={ items:items };
    var note=(noteEl.value||'').trim();
    if(note) payload.client_ref=note;
    window.API.orders.create(payload).then(function(o){
      if(window.toast) toast('Заказ '+((o&&o.number)||'')+' создан','success');
      setTimeout(function(){ location.href='orders.html'; }, 900);
    }).catch(function(e){ btn.disabled=false; if(window.toast) toast((e&&e.message)||'Не удалось создать заказ','error'); });
  });
  window.API.services.list(true).then(render).catch(function(e){ listEl.innerHTML='<div class="list-row"><span class="t-muted">Не удалось загрузить услуги.</span></div>'; });
})();
</script>
</body>
</html>
