<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Документы — Кабинет клиента</title>
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-zone="client" data-page="documents" data-root="../">
<main id="view">
  <div class="page-head"><div><h1 class="page-title">Документы</h1><p class="page-sub">Договоры, счета и акты по вашим заказам.</p></div></div>
  <div class="table-wrap" id="docTable" style="display:none">
    <table>
      <thead><tr><th>Документ</th><th>Заказ</th><th>Дата</th><th>Тип</th><th>Статус</th><th></th></tr></thead>
      <tbody id="docRows"></tbody>
    </table>
  </div>
  <div class="card" id="docEmpty" style="display:none">
    <h3>Пока нет документов</h3>
    <p class="t-muted">Договоры, счета и акты появятся здесь после того, как менеджер оформит и загрузит их по вашим заказам.</p>
  </div>
  <div class="notice mt">💡 Документы по вашим заказам формирует менеджер. Здесь вы сможете их просмотреть и скачать.</div>
</main>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
  var tbody=document.getElementById('docRows');
  var empty=document.getElementById('docEmpty');
  var wrap=document.getElementById('docTable');
  function fmtDate(s){ if(!s) return ''; var d=new Date(s); return isNaN(d)?'':d.toLocaleDateString('ru-RU'); }
  function render(list){
    if(!list || !list.length){ wrap.style.display='none'; empty.style.display=''; return; }
    var esc=API.escapeHtml;
    empty.style.display='none'; wrap.style.display='';
    tbody.innerHTML=list.map(function(d){
      var name=d.filename || ((d.type||'Документ')+(d.number?(' № '+d.number):''));
      return '<tr><td class="t-strong">📄 '+esc(name)+'</td><td>#'+esc(d.order_id)+'</td><td>'+esc(fmtDate(d.created_at))+'</td><td><span class="badge badge--blue">'+esc(d.type||'—')+'</span></td><td><span class="badge badge--green">'+esc(d.status||'—')+'</span></td><td><button class="btn btn-sm" data-id="'+esc(d.id)+'">Скачать</button></td></tr>';
    }).join('');
    tbody.querySelectorAll('button[data-id]').forEach(function(b){
      b.addEventListener('click', function(){
        API.documents.download(b.getAttribute('data-id')).catch(function(e){ window.toast((e&&e.message)||'Не удалось скачать','error'); });
      });
    });
  }
  function load(){
    if(!window.API || !API.isAuthed()) return;
    API.documents.list().then(render).catch(function(e){ window.toast((e&&e.message)||'Не удалось загрузить документы','error'); render([]); });
  }
  load();
})();
</script>
</body>
</html>
