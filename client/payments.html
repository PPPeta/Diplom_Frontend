<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Взаиморасчёты — Кабинет партнёра</title>
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-zone="client" data-page="payments" data-root="../">
<main id="view">
  <div class="page-head"><div><h1 class="page-title">Взаиморасчёты</h1><p class="page-sub">Счета, оплаты и история транзакций.</p></div></div>
  <div class="grid g-3">
    <div class="stat"><div class="lbl"><span class="ic">💳</span> К оплате</div><div class="num" id="s-due">—</div></div>
    <div class="stat"><div class="lbl"><span class="ic">✅</span> Оплачено</div><div class="num" id="s-paid">—</div></div>
    <div class="stat"><div class="lbl"><span class="ic">🧾</span> Всего платежей</div><div class="num" id="s-count">—</div></div>
  </div>
  <div class="card mt">
    <div class="card-h"><h3>История платежей</h3></div>
    <div class="table-wrap" style="border:0">
      <table>
        <thead><tr><th>№</th><th>Заказ</th><th>Направление</th><th>Тип</th><th>Сумма</th><th>Статус</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="t-muted">Загрузка…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>
<script src="../assets/js/api.js"></script>
<script>
(function(){
  var DIR={ in:'Входящий', out:'Исходящий' };
  var KIND={ payment:'Оплата', commission:'Комиссия' };
  var rows=document.getElementById('rows');
  function badge(st){ var m={pending:['Ожидает','amber'],paid:['Оплачен','green'],canceled:['Отменён','red']}; var v=m[st]||[st,'gray']; return '<span class="badge badge--'+v[1]+'">'+v[0]+'</span>'; }
  function row(p){
    var kind=(KIND[p.kind]||p.kind)+(p.provider==='yookassa'?' · ЮKassa':'');
    var act='';
    if(p.provider==='yookassa' && p.status==='pending'){
      if(p.confirmation_url) act+='<a class="btn btn-sm btn-primary" href="'+window.API.escapeHtml(p.confirmation_url)+'" target="_blank" rel="noopener">Оплатить</a> ';
      act+='<button class="btn btn-sm" data-sync="'+p.id+'">Проверить</button>';
    }
    return '<tr><td class="t-strong">#'+p.id+'</td><td>#'+p.order_id+'</td><td>'+(DIR[p.direction]||p.direction)+'</td><td>'+kind+'</td><td class="t-mono">'+window.API.fmtPrice(p.amount)+'</td><td>'+badge(p.status)+'</td><td>'+act+'</td></tr>';
  }
  function load(){
    window.API.payments.list().then(function(list){
      list=list||[];
      var due=0,paid=0; list.forEach(function(p){ var a=Number(p.amount)||0; if(p.status==='paid') paid+=a; else if(p.status!=='canceled') due+=a; });
      document.getElementById('s-due').textContent=window.API.fmtPrice(due);
      document.getElementById('s-paid').textContent=window.API.fmtPrice(paid);
      document.getElementById('s-count').textContent=list.length;
      rows.innerHTML = list.length ? list.map(row).join('') : '<tr><td colspan="7" class="t-muted">Платежей нет.</td></tr>';
    }).catch(function(err){ rows.innerHTML='<tr><td colspan="7" class="t-muted">'+(err.status===401?'Требуется вход.':'Не удалось загрузить платежи.')+'</td></tr>'; });
  }
  rows.addEventListener('click', function(e){
    var btn=e.target.closest('button[data-sync]'); if(!btn) return;
    var id=btn.getAttribute('data-sync'); btn.disabled=true;
    window.API.payments.sync(id).then(function(p){
      if(window.toast) window.toast(p.status==='paid'?'Оплата подтверждена':'Статус: ещё не оплачено', p.status==='paid'?'success':'info');
      load();
    }).catch(function(err){ btn.disabled=false; if(window.toast) window.toast('Не удалось проверить: '+err.message,'error'); });
  });
  load();
})();
</script>
<script src="../assets/js/app.js"></script>
</body>
</html>
