<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет партнёра — Главная</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/polish.css">
</head>
<body data-zone="client" data-page="dashboard" data-root="../">
<main id="view">
  <div class="page-head">
    <div><h1 class="page-title" id="hello">Здравствуйте 👋</h1><p class="page-sub">Сводка по вашим заказам и расчётам.</p></div>
    <a class="btn btn-primary" href="../order-new.html">+ Новый заказ</a>
  </div>
  <div class="grid g-3">
    <div class="stat"><div class="lbl"><span class="ic">📑</span> Активные заказы</div><div class="num" id="s-active">—</div></div>
    <div class="stat"><div class="lbl"><span class="ic">💳</span> К оплате</div><div class="num" id="s-due">—</div></div>
    <div class="stat"><div class="lbl"><span class="ic">🧾</span> Всего заказов</div><div class="num" id="s-total">—</div></div>
  </div>
  <div class="cols mt">
    <div class="card">
      <div class="card-h"><h3>Активные заказы</h3><a class="btn btn-sm" href="orders.html">Все заказы</a></div>
      <div id="active-list"><div class="list-row"><span class="t-muted">Загрузка…</span></div></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>Быстрые действия</h3></div>
      <a class="list-row row-link" href="../order-new.html"><span>➕ Создать новый заказ</span></a>
      <a class="list-row row-link" href="payments.html"><span>💳 Перейти к взаиморасчётам</span></a>
      <a class="list-row row-link" href="orders.html"><span>📑 История заказов</span></a>
    </div>
  </div>
</main>
<script src="../assets/js/api.js"></script>
<script>
(function(){
  var esc = window.API.escapeHtml;
  var OS={ new:['Новый','blue'], confirmed:['Подтверждён','blue'], in_progress:['В работе','amber'], done:['Выполнен','green'], closed:['Закрыт','gray'], cancelled:['Отменён','red'] };
  function badge(st){ var v=OS[st]||[st,'gray']; return '<span class="badge badge--'+v[1]+'">'+esc(v[0])+'</span>'; }
  function errText(err){ if(err&&err.status===401) return 'Требуется вход.'; if(err&&err.status===403) return 'Недостаточно прав.'; return 'Не удалось загрузить данные. Проверьте, что сервер запущен.'; }
  var name=(localStorage.getItem('vp_name')||'').trim();
  if(name) document.getElementById('hello').textContent='Здравствуйте, '+name+' 👋';
  window.API.orders.list().then(function(list){
    list=list||[];
    var active=list.filter(function(o){ return ['new','confirmed','in_progress'].indexOf(o.status)>=0; });
    document.getElementById('s-active').textContent=active.length;
    document.getElementById('s-total').textContent=list.length;
    var box=document.getElementById('active-list');
    box.innerHTML = active.length ? active.slice(0,6).map(function(o){
      return '<a class="list-row row-link" href="order.html?id='+encodeURIComponent(o.id)+'"><div><b>'+esc(o.number)+'</b><br><span class="t-muted">'+window.API.fmtPrice(o.total_amount)+'</span></div><div>'+badge(o.status)+'</div></a>';
    }).join('') : '<div class="list-row"><span class="t-muted">Активных заказов нет.</span></div>';
  }).catch(function(err){ document.getElementById('active-list').innerHTML='<div class="list-row"><span class="t-muted">'+errText(err)+'</span></div>'; });
  window.API.payments.list().then(function(list){
    list=list||[]; var due=0; list.forEach(function(p){ if(p.status!=='paid') due+=Number(p.amount)||0; });
    document.getElementById('s-due').textContent=window.API.fmtPrice(due);
  }).catch(function(){ document.getElementById('s-due').textContent='—'; });
})();
</script>
<script src="../assets/js/app.js"></script>
</body>
</html>
