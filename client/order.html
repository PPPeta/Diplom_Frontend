<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заказ — Кабинет партнёра</title>
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-zone="client" data-page="orders" data-root="../">
<main id="view">
  <div class="breadcrumbs"><a href="orders.html">Мои заказы</a> / <span id="crumb">Заказ</span></div>
  <div class="page-head">
    <div><h1 class="page-title" id="title">Заказ</h1><p class="page-sub" id="sub">Загрузка…</p></div>
  </div>
  <div class="cols">
    <div class="grid" style="gap:18px">
      <div class="card">
        <div class="card-h"><h3>Состав заказа</h3></div>
        <div id="items"><div class="list-row"><span class="t-muted">Загрузка…</span></div></div>
      </div>
    </div>
    <div class="grid" style="gap:18px">
      <div class="card">
        <div class="card-h"><h3>Оплата</h3></div>
        <div id="pays"><div class="list-row"><span class="t-muted">Загрузка…</span></div></div>
        <div class="mt-sm"><button class="btn btn-primary" id="pay-yk" disabled>Оплатить через ЮKassa</button> <span class="t-muted" id="pay-note"></span></div>
      </div>
    </div>
  </div>
  <div class="card mt">
    <div class="card-h"><h3>Обсуждение заказа</h3></div>
    <div class="chat">
      <div class="chat-body" id="msg-body"><div class="t-muted" style="padding:12px">Загрузка…</div></div>
      <form class="chat-form" id="msg-form">
        <input class="input" id="msg-input" placeholder="Напишите сообщение менеджеру…" autocomplete="off" required>
        <button class="btn btn-primary" type="submit">Отправить</button>
      </form>
    </div>
  </div>
</main>
<script src="../assets/js/api.js"></script>
<script>
(function(){
  var OS={ new:['Новый','blue'], confirmed:['Подтверждён','blue'], in_progress:['В работе','amber'], done:['Выполнен','green'], closed:['Закрыт','gray'], cancelled:['Отменён','red'] };
  function badge(st){ var v=OS[st]||[st,'gray']; return '<span class="badge badge--'+v[1]+'">'+v[0]+'</span>'; }
  var PB={ pending:['Ожидает','amber'], paid:['Оплачен','green'], canceled:['Отменён','red'] };
  function pbadge(st){ var v=PB[st]||[st,'gray']; return '<span class="badge badge--'+v[1]+'">'+v[0]+'</span>'; }
  function fmtDate(iso){ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d)) return iso; return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear(); }
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function timeOf(iso){ var d=new Date(iso); if(isNaN(d)) return ''; return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
  function myId(){ try{ var d=window.API.decodeJwt(localStorage.getItem('vp_access')); return d?String(d.sub):null; }catch(e){ return null; } }
  var mineId=myId();
  var id=new URLSearchParams(location.search).get('id');
  if(!id){ document.getElementById('sub').textContent='Заказ не указан.'; return; }
  var svcMap={};
  var orderTotal=0, orderStatus=null, paidSum=0;
  function updatePayBtn(){
    var payBtn=document.getElementById('pay-yk'); if(!payBtn) return;
    var note=document.getElementById('pay-note');
    if(orderStatus==='closed'||orderStatus==='cancelled'){ payBtn.disabled=true; note.textContent='Заказ '+(orderStatus==='cancelled'?'отменён':'закрыт')+'.'; return; }
    if(orderTotal>0 && paidSum>=orderTotal){ payBtn.disabled=true; note.textContent='Заказ оплачен.'; return; }
    payBtn.disabled=false; note.textContent='';
  }
  function renderItems(o){
    var box=document.getElementById('items');
    var html=(o.items||[]).map(function(it){
      var nm=svcMap[it.service_id]||('Услуга #'+it.service_id);
      return '<div class="list-row"><span>'+nm+' <span class="t-muted">×'+it.qty+'</span></span><b>'+window.API.fmtPrice(it.sum)+'</b></div>';
    }).join('');
    html += '<div class="list-row" style="font-size:17px"><b>Итого</b><b class="price">'+window.API.fmtPrice(o.total_amount)+'</b></div>';
    box.innerHTML=html;
  }
  window.API.services.list().then(function(s){ (s||[]).forEach(function(x){ svcMap[x.id]=x.name; }); }).catch(function(){}).then(function(){
    return window.API.orders.get(id);
  }).then(function(o){
    document.getElementById('crumb').textContent=o.number;
    document.getElementById('title').innerHTML=o.number+' '+badge(o.status);
    document.getElementById('sub').textContent='Создан '+fmtDate(o.created_at);
    renderItems(o);
    orderTotal=Number(o.total_amount)||0; orderStatus=o.status; updatePayBtn();
  }).catch(function(err){ document.getElementById('sub').textContent=(err.status===404?'Заказ не найден.':(err.status===401?'Требуется вход.':'Ошибка загрузки.')); document.getElementById('items').innerHTML=''; });

  // --- Оплаты ---
  function payRow(p){
    var prov = p.provider==='yookassa' ? ' <span class="t-muted">· ЮKassa</span>' : '';
    var act='';
    if(p.provider==='yookassa' && p.status==='pending'){
      if(p.confirmation_url) act += ' <a class="btn btn-sm btn-primary" href="'+esc(p.confirmation_url)+'" target="_blank" rel="noopener">Оплатить</a>';
      act += ' <button class="btn btn-sm" data-sync="'+p.id+'">Проверить</button>';
    }
    return '<div class="list-row"><span>'+window.API.fmtPrice(p.amount)+prov+'</span><span>'+pbadge(p.status)+act+'</span></div>';
  }
  function loadPays(){
    var box=document.getElementById('pays');
    window.API.payments.list(id).then(function(list){
      list=list||[];
      paidSum=list.reduce(function(s,p){ return s+(p.status==='paid'?(Number(p.amount)||0):0); },0); updatePayBtn();
      box.innerHTML = list.length ? list.map(payRow).join('') : '<div class="list-row"><span class="t-muted">Платежей пока нет.</span></div>';
    }).catch(function(){ box.innerHTML='<div class="list-row"><span class="t-muted">Не удалось загрузить оплаты.</span></div>'; });
  }
  document.getElementById('pays').addEventListener('click', function(e){
    var btn=e.target.closest('button[data-sync]'); if(!btn) return;
    var pid=btn.getAttribute('data-sync'); btn.disabled=true;
    window.API.payments.sync(pid).then(function(p){
      if(window.toast) window.toast(p.status==='paid'?'Оплата подтверждена':(p.status==='canceled'?'Платёж отменён':'Платёж пока не оплачен'), p.status==='paid'?'success':'info');
      loadPays();
    }).catch(function(err){ btn.disabled=false; if(window.toast) window.toast('Не удалось проверить: '+err.message,'error'); });
  });
  document.getElementById('pay-yk').addEventListener('click', function(){
    var btn=this; btn.disabled=true; var note=document.getElementById('pay-note'); note.textContent='Создаём платёж…';
    window.API.payments.checkout(id).then(function(p){
      note.textContent='';
      if(p.confirmation_url){ window.open(p.confirmation_url,'_blank','noopener'); }
      else if(window.toast){ window.toast('Платёж создан','success'); }
      loadPays(); btn.disabled=false;
    }).catch(function(err){
      btn.disabled=false; note.textContent='';
      var msg = err.status===409 ? 'Заказ уже оплачен' : (err.status===503 ? 'ЮKassa не настроена' : (err.status===400 ? 'Сумма заказа должна быть больше нуля' : (err.status===403 ? 'Нет доступа' : 'Не удалось создать платёж')));
      if(window.toast) window.toast(msg,'error');
    });
  });
  loadPays();

  // --- Обсуждение заказа (сообщения) ---
  function loadMessages(){
    var body=document.getElementById('msg-body');
    window.API.request('/orders/'+id+'/messages').then(function(msgs){
      msgs=msgs||[];
      body.innerHTML = msgs.length ? msgs.map(function(m){
        var out = mineId && String(m.author_id)===mineId;
        return '<div class="bubble '+(out?'out':'in')+'">'+(out?'':'<b class="b-author">'+esc(m.author_name||'Сотрудник')+'</b> ')+esc(m.body)+'<span class="b-time">'+timeOf(m.created_at)+'</span></div>';
      }).join('') : '<div class="t-muted" style="padding:12px">Пока нет сообщений.</div>';
      body.scrollTop=body.scrollHeight;
    }).catch(function(err){ body.innerHTML='<div class="t-muted" style="padding:12px">'+(err.status===403?'Нет доступа.':'Не удалось загрузить сообщения.')+'</div>'; });
  }
  document.getElementById('msg-form').addEventListener('submit', function(e){
    e.preventDefault();
    var input=document.getElementById('msg-input'); var text=input.value.trim(); if(!text) return;
    var btn=this.querySelector('button'); btn.disabled=true;
    window.API.request('/orders/'+id+'/messages', { method:'POST', json:{ body:text } }).then(function(){ input.value=''; btn.disabled=false; loadMessages(); }).catch(function(err){ btn.disabled=false; if(window.toast) window.toast(err.status===403?'Нет доступа':'Не удалось отправить','error'); });
  });
  loadMessages();
})();
</script>
<script src="../assets/js/app.js"></script>
</body>
</html>
