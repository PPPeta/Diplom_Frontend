<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Календарь — Исполнитель</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/polish.css">
</head>
<body data-zone="executor" data-page="calendar" data-root="../">
<main id="view">
  <div class="page-head"><div><h1 class="page-title">Календарь</h1><p class="page-sub">Ваше расписание задач на неделю.</p></div><div class="quick-actions"><button class="btn btn-sm" data-toast="Предыдущая неделя">‹ Неделя</button><button class="btn btn-sm" data-toast="Следующая неделя">Неделя ›</button></div></div>
  <div class="cal">
    <div class="cal-day"><div class="cal-h"><span class="cal-dow">Пн</span><span class="cal-date">11</span></div><div class="cal-empty">Нет задач</div></div>
    <div class="cal-day today"><div class="cal-h"><span class="cal-dow">Вт</span><span class="cal-date">12</span></div><div class="cal-event amber"><span class="t">09:00</span> Подготовка #1042</div></div>
    <div class="cal-day"><div class="cal-h"><span class="cal-dow">Ср</span><span class="cal-date">13</span></div><div class="cal-event red"><span class="t">09:00</span> Транспорт #1042</div></div>
    <div class="cal-day"><div class="cal-h"><span class="cal-dow">Чт</span><span class="cal-date">14</span></div><div class="cal-event blue"><span class="t">12:00</span> Документы #1040</div></div>
    <div class="cal-day"><div class="cal-h"><span class="cal-dow">Пт</span><span class="cal-date">15</span></div><div class="cal-empty">Нет задач</div></div>
    <div class="cal-day"><div class="cal-h"><span class="cal-dow">Сб</span><span class="cal-date">16</span></div><div class="cal-empty">Выходной</div></div>
    <div class="cal-day"><div class="cal-h"><span class="cal-dow">Вс</span><span class="cal-date">17</span></div><div class="cal-empty">Выходной</div></div>
  </div>
</main>
<script src="../assets/js/app.js"></script>
</body>
</html>
