<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Календарь — Исполнитель</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/polish.css">
</head>
<body data-zone="executor" data-page="calendar" data-root="../">
<main id="view">
  <div class="page-head"><div><h1 class="page-title">Календарь</h1><p class="page-sub">Ваши задачи по срокам на текущую неделю.</p></div></div>
  <div class="cal" id="cal"><div class="t-muted" style="padding:14px">Загрузка…</div></div>
</main>
<script src="../assets/js/api.js"></script>
<script>
(function(){
  var esc=window.API.escapeHtml;
  var DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  var cal=document.getElementById('cal');
  function weekStart(){ var n=new Date(); n.setHours(0,0,0,0); var dow=(n.getDay()+6)%7; n.setDate(n.getDate()-dow); return n; }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
  function colorFor(t){ if(t.status==='done') return 'green'; if(t.status==='in_progress') return 'amber'; return 'blue'; }
  function render(tasks){
    var start=weekStart(); var today=new Date(); today.setHours(0,0,0,0);
    var html='';
    for(var i=0;i<7;i++){
      var day=new Date(start); day.setDate(start.getDate()+i);
      var evs=(tasks||[]).filter(function(t){ if(!t.due_date) return false; var d=new Date(t.due_date); return !isNaN(d)&&sameDay(d,day); });
      var inner = evs.length ? evs.map(function(t){ return '<div class="cal-event '+colorFor(t)+'">'+esc(t.title)+' <span class="t-muted">#'+t.order_id+'</span></div>'; }).join('') : '<div class="cal-empty">Нет задач</div>';
      html+='<div class="cal-day'+(sameDay(day,today)?' today':'')+'"><div class="cal-h"><span class="cal-dow">'+DOW[i]+'</span><span class="cal-date">'+day.getDate()+'</span></div>'+inner+'</div>';
    }
    cal.innerHTML=html;
  }
  window.API.request('/tasks').then(render).catch(function(err){ cal.innerHTML='<div class="t-muted" style="padding:14px">'+(err.status===401?'Требуется вход исполнителя.':'Не удалось загрузить задачи.')+'</div>'; });
})();
</script>
<script src="../assets/js/app.js"></script>
</body>
</html>
