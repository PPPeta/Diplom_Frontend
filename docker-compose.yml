services:
  frontend:
    build: .
    image: vp-frontend
    container_name: vp-frontend
    ports:
      # хост:80 -> контейнер:80
      - "80:80"
    extra_hosts:
      # доступ из контейнера к бэкенду, опубликованному на хосте :8000
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
