<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог услуг — Вечная Память</title>
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/cards.css">
</head>
<body data-zone="public" data-page="services" data-root="">
<div class="container section-sm">
  <div class="breadcrumbs"><a href="index.html">Главная</a> / Каталог услуг</div>
  <h1 class="page-title">Каталог услуг</h1>
  <p class="page-sub">Актуальные услуги и цены бюро «Вечная Память».</p>

  <div class="filters mt">
    <div class="chips" id="cat-chips">
      <span class="chip active" data-cat="">Все</span>
    </div>
    <div class="search" style="margin-left:auto"><input id="svc-search" class="input" placeholder="Поиск услуги…"></div>
  </div>

  <div class="grid g-3 mt" id="svc-grid">
    <p class="page-sub">Загрузка каталога…</p>
  </div>

  <div class="cta-row mt" style="justify-content:center"><a class="btn btn-primary" href="order-new.html">Перейти к оформлению заявки</a></div>
</div>
<script src="assets/js/api.js"></script>
<script>
(function(){
  var esc = window.API.escapeHtml;
  var grid = document.getElementById('svc-grid');
  var chipsBox = document.getElementById('cat-chips');
  var search = document.getElementById('svc-search');
  var all = [];

  function activeCat(){ var a = chipsBox.querySelector('.chip.active'); return a ? (a.getAttribute('data-cat') || '') : ''; }

  function render(){
    var q = (search.value || '').trim().toLowerCase();
    var cat = activeCat();
    var rows = all.filter(function(s){
      var okCat = !cat || s.category === cat;
      var okQ = !q || (s.name || '').toLowerCase().indexOf(q) >= 0 || (s.code || '').toLowerCase().indexOf(q) >= 0;
      return okCat && okQ;
    });
    if(!rows.length){ grid.innerHTML = '<p class="page-sub">Ничего не найдено.</p>'; return; }
    grid.innerHTML = rows.map(function(s){
      return '<article class="svc">' +
        '<div class="svc-head"><span class="svc-ico">🕯️</span><span class="svc-tag">' + esc(s.category || 'Услуга') + '</span></div>' +
        '<div class="svc-body"><h4>' + esc(s.name) + '</h4><p>Код: ' + esc(s.code) + '</p></div>' +
        '<div class="foot"><span class="price">' + window.API.fmtPrice(s.base_price) + '</span>' +
        '<a class="btn btn-sm btn-primary" href="order-new.html?svc=' + encodeURIComponent(s.code) + '">В заявку →</a></div></article>';
    }).join('');
  }

  function buildChips(){
    var cats = [];
    all.forEach(function(s){ if(s.category && cats.indexOf(s.category) < 0) cats.push(s.category); });
    chipsBox.innerHTML = '<span class="chip active" data-cat="">Все</span>' +
      cats.map(function(c){ return '<span class="chip" data-cat="' + esc(c) + '">' + esc(c) + '</span>'; }).join('');
    chipsBox.querySelectorAll('.chip').forEach(function(ch){
      ch.addEventListener('click', function(){
        chipsBox.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('active'); });
        ch.classList.add('active');
        render();
      });
    });
  }

  window.API.services.list(true).then(function(list){
    all = list || [];
    buildChips();
    search.addEventListener('input', render);
    render();
  }).catch(function(){
    grid.innerHTML = '<p class="page-sub">Не удалось загрузить каталог. Убедитесь, что API запущен на ' + esc(window.API.base) + '.</p>';
  });
})();
</script>
<script src="assets/js/app.js"></script>
</body>
</html>
