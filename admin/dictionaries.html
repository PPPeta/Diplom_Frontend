<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Справочники — Администрирование</title>
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-zone="admin" data-page="dictionaries" data-root="../">
<main id="view">
  <div class="page-head"><div><h1 class="page-title">Справочники</h1><p class="page-sub">Системные списки и значения.</p></div></div>
  <div class="grid g-3">
    <div class="card"><div class="card-h"><h3>Услуги</h3><span class="badge badge--gray">12</span></div><p class="t-muted">Каталог предоставляемых услуг.</p><button class="btn btn-sm mt-sm" data-toast="Редактирование справочника (скоро)" data-toast-type="error">Открыть</button></div>
    <div class="card"><div class="card-h"><h3>Товары</h3><span class="badge badge--gray">28</span></div><p class="t-muted">Номенклатура товаров.</p><button class="btn btn-sm mt-sm" data-toast="Редактирование справочника (скоро)" data-toast-type="error">Открыть</button></div>
    <div class="card"><div class="card-h"><h3>Статусы заказов</h3><span class="badge badge--gray">6</span></div><p class="t-muted">Этапы жизненного цикла заказа.</p><button class="btn btn-sm mt-sm" data-toast="Редактирование справочника (скоро)" data-toast-type="error">Открыть</button></div>
    <div class="card"><div class="card-h"><h3>Способы оплаты</h3><span class="badge badge--gray">4</span></div><p class="t-muted">Доступные методы оплаты.</p><button class="btn btn-sm mt-sm" data-toast="Редактирование справочника (скоро)" data-toast-type="error">Открыть</button></div>
    <div class="card"><div class="card-h"><h3>Типы документов</h3><span class="badge badge--gray">5</span></div><p class="t-muted">Договоры, счета, акты и др.</p><button class="btn btn-sm mt-sm" data-toast="Редактирование справочника (скоро)" data-toast-type="error">Открыть</button></div>
    <div class="card"><div class="card-h"><h3>Города</h3><span class="badge badge--gray">9</span></div><p class="t-muted">Зоны обслуживания.</p><button class="btn btn-sm mt-sm" data-toast="Редактирование справочника (скоро)" data-toast-type="error">Открыть</button></div>
  </div>
</main>
<script src="../assets/js/app.js"></script>
</body>
</html>
