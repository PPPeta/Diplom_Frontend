<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корзина — Вечная Память</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-zone="public" data-page="cart" data-root="">
<div class="container section-sm">
  <div class="breadcrumbs"><a href="index.html">Главная</a> / Корзина</div>
  <h1 class="page-title">Корзина</h1>
  <p class="page-sub">Соберите нужные услуги и оставьте контакты — менеджер свяжется для подтверждения.</p>

  <div class="cols mt">
    <div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h3>Выбранные позиции</h3>
          <button class="btn btn-sm" id="cart-clear" type="button">Очистить</button>
        </div>
        <div id="cart-list" class="mt-sm"><p class="t-muted">Корзина пуста.</p></div>
        <hr class="divider">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:18px"><span>Ориентировочно</span><b id="cart-total" class="t-mono">0 ₽</b></div>
        <div class="notice mt">💡 Сумма предварительная и будет уточнена менеджером.</div>
        <div class="cta-row mt"><a class="btn" href="catalog-services.html">← Продолжить выбор</a></div>
      </div>
    </div>

    <form id="cart-form" class="card">
      <h3>Контактные данные</h3>
      <div class="form mt-sm">
        <div class="field"><label>ФИО</label><input id="c-name" required placeholder="Иванов Иван Иванович"></div>
        <div class="field"><label>Телефон</label><input id="c-phone" required placeholder="+7 …"></div>
        <div class="field"><label>Email</label><input id="c-email" type="email" placeholder="mail@example.ru"></div>
        <div class="field"><label>Способ связи</label><select id="c-contact"><option>Телефон</option><option>Email</option><option>Мессенджер</option></select></div>
        <div class="field"><label>Комментарий</label><textarea id="c-comment" placeholder="Уточните пожелания…"></textarea></div>
        <label class="checkbox"><input id="c-consent" type="checkbox" required> Согласен на обработку персональных данных</label>
        <button class="btn btn-primary btn-block" type="submit" id="c-submit">Отправить заявку</button>
      </div>
    </form>
  </div>
</div>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cart.js"></script>
<script>
(function(){
  var esc = window.API.escapeHtml;
  var listEl = document.getElementById('cart-list');
  var totalEl = document.getElementById('cart-total');

  function render(items){
    if(!items.length){
      listEl.innerHTML = '<p class="t-muted">Корзина пуста. <a href="catalog-services.html">Перейти в каталог</a></p>';
    } else {
      listEl.innerHTML = items.map(function(it){
        var k = it.code || it.name;
        return '<div class="list-row" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06)">' +
          '<span style="flex:1"><b>'+esc(it.name)+'</b><br><span class="t-muted t-mono">'+(it.code?esc(it.code)+' · ':'')+window.Cart.fmt(it.price)+'</span></span>' +
          '<input type="number" min="1" value="'+(parseInt(it.qty,10)||1)+'" class="input cart-qty" data-key="'+esc(k)+'" style="width:60px;text-align:center">' +
          '<button class="btn btn-sm cart-del" data-key="'+esc(k)+'" type="button" title="Удалить">✕</button>' +
          '</div>';
      }).join('');
    }
    totalEl.textContent = window.Cart.fmt(window.Cart.total());
  }

  listEl.addEventListener('input', function(e){
    if(e.target.classList && e.target.classList.contains('cart-qty')){
      window.Cart.setQty(e.target.getAttribute('data-key'), e.target.value);
    }
  });
  listEl.addEventListener('click', function(e){
    var del = e.target.closest ? e.target.closest('.cart-del') : null;
    if(del){ window.Cart.remove(del.getAttribute('data-key')); }
  });
  document.getElementById('cart-clear').addEventListener('click', function(){ window.Cart.clear(); });

  window.Cart.subscribe(render);

  document.getElementById('cart-form').addEventListener('submit', function(e){
    e.preventDefault();
    var items = window.Cart.items();
    if(!items.length){ window.toast('Корзина пуста — добавьте услуги', 'error'); return; }
    if(!document.getElementById('c-consent').checked){ window.toast('Подтвердите согласие на обработку ПДн', 'error'); return; }
    var btn = document.getElementById('c-submit'); btn.disabled = true;
    var lines = items.map(function(it){ return it.name + ' ×' + (parseInt(it.qty,10)||1); });
    var parts = ['Услуги: ' + lines.join('; ')];
    var way = document.getElementById('c-contact').value;
    var comment = document.getElementById('c-comment').value.trim();
    if(way) parts.push('Способ связи: ' + way);
    if(comment) parts.push(comment);
    parts.push('Ориентировочно: ' + window.Cart.fmt(window.Cart.total()));
    window.API.requests.create({
      client_name: document.getElementById('c-name').value.trim(),
      phone: document.getElementById('c-phone').value.trim() || null,
      email: document.getElementById('c-email').value.trim() || null,
      message: parts.join(' | '),
      source: 'site',
      pdn_consent: true
    }).then(function(r){
      window.toast('Заявка отправлена — №' + r.id, 'success');
      window.Cart.clear();
      document.getElementById('cart-form').reset();
      btn.disabled = false;
    }).catch(function(err){
      window.toast('Ошибка отправки: ' + err.message, 'error');
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
